services:
  # Backend Application
  sm-api:
    image: zevome/smarter-home-api:latest
    container_name: sm-api
    restart: unless-stopped
    ports:
      - ${BACKEND_PORT}:3001
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_PORT: 3001
      FRONTEND_PORT: ${FRONTEND_PORT}
      AUTH_SECRET: ${AUTH_SECRET}
      JWT_SECRET: ${AUTH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smapi.entrypoints=web"
      - "traefik.http.routers.smapi.rule=Host(`sm-api.${DOMAIN_NAME}`)"
      - "traefik.http.routers.smapi-secure.tls=true"
      - "traefik.http.routers.smapi-secure.entrypoints=websecure"
      - "traefik.http.routers.smapi-secure.rule=Host(`sm-api.${DOMAIN_NAME}`)"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
  sm-web:
    image: zevome/smarter-home-web:latest
    container_name: sm-web
    restart: unless-stopped
    ports:
      - ${FRONTEND_PORT}:80
    environment:
      API_URL: https://sm-api.${DOMAIN_NAME}
    networks:
      - frontend
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smweb.entrypoints=web"
      - "traefik.http.routers.smweb.rule=Host(`sm-web.${DOMAIN_NAME}`)"
      - "traefik.http.routers.smweb-secure.tls=true"
      - "traefik.http.routers.smweb-secure.entrypoints=websecure"
      - "traefik.http.routers.smweb-secure.rule=Host(`sm-web.${DOMAIN_NAME}`)"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
networks:
  backend:
    external: true
  frontend:
    external: true
